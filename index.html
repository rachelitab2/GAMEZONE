<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAMEZONE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">
            GAMEZONE

        </div>

        <nav>
            <a href="#">Inicio</a>
            <a href="#">Juegos</a>
            <a href="#">Ofertas</a>
            <a href="#">Contacto</a>
        </nav>
    </header>
    
    <section class="hero">
        <h1>GAMEZONE</h1>

        <p>Los videojuegos más populares
        en un solo lugar.</p>

        <button>
            Ver Juegos
        </button>
    </section>

    <section class="games">
        <h2>TOP DE  JUEGOS</h2>
        <div class="games-grid">
            <div class="card">
                <img src="img/EA SPORTS FC 25 EDICIÓN ESTÁNDAR - Xbox.jfif" alt="FIFA 25">
                <h3>FIFA</h3>
                <P>RD$ 2,500</P>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img src="img/descarga.jfif" alt="MINECRAFT">
                <h3>Minecraft</h3>
                <p>RD$ 1,800</p>
                <button>Comprar</button>
            </div>

            <div class="card">
                <img src="img/Grand Theft Auto V.jfif" alt="">
                <h3>  GTA V</h3>
                <p>RD$2,200</p>
                <button>Comprar</button> 
            </div>

            <div class="card">
                <img src="img/valorant - Google Search.jfif" alt="">
                <h3>Valorant</h3>
                <p>Gratis</p>
                <button>Descargar</button>
            </div>

            <div class="card">
                <img src="img/Fortnite.jfif" alt="">
                <h3>Fortnite</h3>
                <p>Gratis</p>
                <button>Descargar</button>
            </div>

            <div class="card">
                <img src="img/Mbappe FC27 Cover.jfif" alt="">
                <h3>EA FC</h3>
                <p>RD$ 2,300</p>
                <button>Comprar</button>
            </div>
        </div>
    </section>
</body>
</html>
